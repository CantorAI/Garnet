<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #16202a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #4b5a67; }
      .lane-title { font: 700 17px Arial, sans-serif; fill: #17212b; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #111827; }
      .box-text { font: 13px Arial, sans-serif; fill: #344054; }
      .small { font: 12px Arial, sans-serif; fill: #475467; }
      .note { font: 13px Arial, sans-serif; fill: #1f2937; }
      .lane { fill: #f8fafc; stroke: #d9e2ec; stroke-width: 1.5; rx: 14; }
      .source { fill: #e8f3ff; stroke: #4c93d1; stroke-width: 2; rx: 10; }
      .ir { fill: #eef8ee; stroke: #4f9f5f; stroke-width: 2; rx: 10; }
      .backend { fill: #fff5e6; stroke: #d98b21; stroke-width: 2; rx: 10; }
      .runtime { fill: #f4ecff; stroke: #8b5cc7; stroke-width: 2; rx: 10; }
      .debug { fill: #fff0f3; stroke: #d65a75; stroke-width: 2; rx: 10; }
      .artifact { fill: #f2f4f7; stroke: #98a2b3; stroke-width: 2; rx: 10; }
      .arrow { stroke: #344054; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #667085; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 6 5; }
      .partition { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#344054"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#667085"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>
  <text x="56" y="52" class="title">Garnet Architecture V2</text>
  <text x="56" y="80" class="subtitle">xlang tensor-expression model source -> TensorGraph -> backend handlers -> serving runtime + Workbench debug</text>

  <rect x="40" y="112" width="1320" height="118" class="lane"/>
  <text x="62" y="142" class="lane-title">1. Model Source And Metadata</text>

  <rect x="72" y="160" width="210" height="48" class="source"/>
  <text x="90" y="181" class="box-title">.x Model Files</text>
  <text x="90" y="199" class="box-text">Qwen-VL / DeepSeek / future</text>

  <rect x="326" y="160" width="230" height="48" class="source"/>
  <text x="344" y="181" class="box-title">Config + Processor</text>
  <text x="344" y="199" class="box-text">layers, heads, image rules</text>

  <rect x="600" y="160" width="210" height="48" class="source"/>
  <text x="618" y="181" class="box-title">Weights</text>
  <text x="618" y="199" class="box-text">safetensors/bin, shapes, dtype</text>

  <rect x="854" y="160" width="216" height="48" class="source"/>
  <text x="872" y="181" class="box-title">Input Shapes</text>
  <text x="872" y="199" class="box-text">text, image, stream frame</text>

  <rect x="1114" y="160" width="210" height="48" class="source"/>
  <text x="1132" y="181" class="box-title">Backend Policy</text>
  <text x="1132" y="199" class="box-text">JIT / TensorRT / hybrid</text>

  <path d="M177 208 L177 272" class="arrow"/>
  <path d="M441 208 L441 272" class="arrow"/>
  <path d="M705 208 L705 272" class="arrow"/>
  <path d="M962 208 L962 272" class="arrow"/>
  <path d="M1219 208 L1219 272" class="arrow"/>

  <rect x="40" y="264" width="1320" height="166" class="lane"/>
  <text x="62" y="294" class="lane-title">2. xlang Tensor Expression And TensorGraph</text>

  <rect x="118" y="322" width="250" height="66" class="ir"/>
  <text x="138" y="346" class="box-title">TensorExpression</text>
  <text x="138" y="365" class="box-text">ops, operands, loops, branches</text>
  <text x="138" y="383" class="box-text">binary_op / unary_op open nodes</text>

  <rect x="438" y="322" width="250" height="66" class="ir"/>
  <text x="458" y="346" class="box-title">TensorGraph</text>
  <text x="458" y="365" class="box-text">scheduled TensorRunItems</text>
  <text x="458" y="383" class="box-text">Header / Branch / Op / Trailer</text>

  <rect x="758" y="322" width="250" height="66" class="ir"/>
  <text x="778" y="346" class="box-title">Control Flow</text>
  <text x="778" y="365" class="box-text">compile-time fold</text>
  <text x="778" y="383" class="box-text">runtime branch lowering</text>

  <rect x="1078" y="322" width="210" height="66" class="ir"/>
  <text x="1098" y="346" class="box-title">Graph Metadata</text>
  <text x="1098" y="365" class="box-text">names, shapes, tags</text>
  <text x="1098" y="383" class="box-text">Workbench node ids</text>

  <path d="M368 355 L438 355" class="arrow"/>
  <path d="M688 355 L758 355" class="arrow"/>
  <path d="M1008 355 L1078 355" class="arrow"/>
  <path d="M563 388 L563 462" class="arrow"/>
  <path d="M1183 388 L1183 462" class="arrow-soft"/>

  <rect x="40" y="462" width="1320" height="234" class="lane"/>
  <text x="62" y="492" class="lane-title">3. Backend Handlers And Lowering</text>

  <rect x="82" y="528" width="270" height="118" class="backend"/>
  <text x="104" y="552" class="box-title">JIT CUDA Handler</text>
  <text x="104" y="574" class="box-text">GarnetTensor op handlers</text>
  <text x="104" y="592" class="box-text">emit CUDA C++ strings</text>
  <text x="104" y="610" class="box-text">NVRTC -> PTX -> CUfunction</text>
  <text x="104" y="628" class="box-text">good for custom dynamic kernels</text>

  <rect x="392" y="528" width="270" height="118" class="backend"/>
  <text x="414" y="552" class="box-title">TensorRT Handler</text>
  <text x="414" y="574" class="box-text">ITRTContext</text>
  <text x="414" y="592" class="box-text">HandleBinaryOp / HandleUnaryOp</text>
  <text x="414" y="610" class="box-text">ITensor map + network layers</text>
  <text x="414" y="628" class="box-text">static dense math engine</text>

  <rect x="702" y="528" width="270" height="118" class="backend"/>
  <text x="724" y="552" class="box-title">Garnet Custom Kernels</text>
  <text x="724" y="574" class="box-text">RoPE / MRoPE</text>
  <text x="724" y="592" class="box-text">paged KV write/read</text>
  <text x="724" y="610" class="box-text">flash/paged attention</text>
  <text x="724" y="628" class="box-text">sampling, stats, snapshots</text>

  <rect x="1012" y="528" width="270" height="118" class="debug"/>
  <text x="1034" y="552" class="box-title">Debug / Workbench Handler</text>
  <text x="1034" y="574" class="box-text">graph-only lowering</text>
  <text x="1034" y="592" class="box-text">shape, op status, partition</text>
  <text x="1034" y="610" class="box-text">trace hooks + snapshot points</text>
  <text x="1034" y="628" class="box-text">Garnet vs HF/vLLM diff</text>

  <path d="M217 646 L217 744" class="arrow"/>
  <path d="M527 646 L527 744" class="arrow"/>
  <path d="M837 646 L837 744" class="arrow"/>
  <path d="M1147 646 L1147 744" class="arrow"/>

  <rect x="40" y="734" width="1320" height="184" class="lane"/>
  <text x="62" y="764" class="lane-title">4. Runtime, Serving, And Observability</text>

  <rect x="82" y="798" width="240" height="80" class="runtime"/>
  <text x="104" y="822" class="box-title">Serving Runtime</text>
  <text x="104" y="844" class="box-text">OpenAI API / local C++ API</text>
  <text x="104" y="862" class="box-text">request lifecycle + streaming</text>

  <rect x="358" y="798" width="240" height="80" class="runtime"/>
  <text x="380" y="822" class="box-title">Scheduler</text>
  <text x="380" y="844" class="box-text">fresh-frame admission</text>
  <text x="380" y="862" class="box-text">prefill/decode batching</text>

  <rect x="634" y="798" width="240" height="80" class="runtime"/>
  <text x="656" y="822" class="box-title">Paged KV Cache</text>
  <text x="656" y="844" class="box-text">block tables, ref counts</text>
  <text x="656" y="862" class="box-text">system prefix + visual spans</text>

  <rect x="910" y="798" width="190" height="80" class="runtime"/>
  <text x="932" y="822" class="box-title">Metrics</text>
  <text x="932" y="844" class="box-text">TTFT, frame age</text>
  <text x="932" y="862" class="box-text">tokens/sec, memory</text>

  <rect x="1136" y="798" width="190" height="80" class="debug"/>
  <text x="1158" y="822" class="box-title">Workbench</text>
  <text x="1158" y="844" class="box-text">graph, KV, trace</text>
  <text x="1158" y="862" class="box-text">GPU snapshots</text>

  <path d="M322 838 L358 838" class="arrow"/>
  <path d="M598 838 L634 838" class="arrow"/>
  <path d="M874 838 L910 838" class="arrow"/>
  <path d="M1100 838 L1136 838" class="arrow-soft"/>

  <rect x="82" y="682" width="1200" height="34" class="artifact"/>
  <text x="104" y="704" class="note">Backend partition example: TensorRT for dense static math, Garnet CUDA for dynamic attention/KV/sampling, Workbench for graph and debug visibility.</text>
  <path d="M682 646 L682 682" class="arrow-soft"/>

  <rect x="72" y="930" width="1252" height="34" class="artifact"/>
  <text x="94" y="952" class="small">V2 principle: one xlang model graph, many handlers. The same TensorGraph should compile, execute, visualize, debug, and benchmark.</text>
</svg>
