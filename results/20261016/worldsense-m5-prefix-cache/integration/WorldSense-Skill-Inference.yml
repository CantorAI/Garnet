id: worldsense_skill_inference
file_type: CantorAI Pipeline
code_behide: ''
parameters: ''
nodes:
- name: Skill-Frame-Source
  type: xWorld-VisionSource
  parameters:
    sourceMode: dataview
    dataViewMaxFrames: 2
  description: Latest-frame source for cameras with assigned skills
  isService: 0
  uri: xWorld
  inputPins: null
  outputPins:
  - name: output
- name: Skill-Candidate-Filter
  type: xWorld-SemanticCandidate
  parameters: {}
  description: Portable candidates verified by Garnet Metal; geometry tracking requires
    a detector pipeline
  isService: 0
  uri: xWorld
  inputPins:
  - name: input
  outputPins:
  - name: output
  - name: store
- name: Skill-VLM
  type: Garnet-VLM
  parameters:
    modelRoot: workspace:out/models/Qwen3.5-4B
    xmodelRoot: workspace:Garnet/xModel/qwen35/vl_4b
    cacheRoot: workspace:out/cache/Qwen3.5-4B
    profile: '{"maxInputTokens": 1536, "maxOutputTokens": 512, "imagePixels": 65536,
      "prefillChunk": 64, "linearChunk": true}'
    modelId: Qwen3.5-4B
    maxOutputTokens: 512
    reasoningModel:
      modelRoot: workspace:out/models/Qwen3-1.7B
      xmodelRoot: workspace:Garnet/xModel/qwen/metal_dense
      cacheRoot: workspace:out/cache/Qwen3-1.7B
      modelId: Qwen3-1.7B
      profile: '{"maxInputTokens": 1536, "maxOutputTokens": 512, "minPixels": 65536,
        "maxPixels": 65536, "prefillChunk": 16, "textPrefixCache": true}'
    repairUnclosedJsonRoot: true
  description: Structured VLM verification and search metadata
  isService: 0
  uri: galaxy_garnetfilter
  inputPins:
  - name: input
  outputPins:
  - name: output
- name: Skill-Result-Store
  type: xWorld-VisionDb
  parameters:
    vlm_only: true
    batch_size: 10
    max_queue_size: 100
  description: Timed event and searchable observation storage
  isService: 0
  uri: xWorld
  inputPins:
  - name: input
  - name: input2
  outputPins: null
connections:
- sourceFilter: Skill-Frame-Source
  sourcePin: output
  destinationFilter: Skill-Candidate-Filter
  destinationPin: input
  strongConnection: 1
- sourceFilter: Skill-Candidate-Filter
  sourcePin: output
  destinationFilter: Skill-VLM
  destinationPin: input
  strongConnection: 1
- sourceFilter: Skill-Candidate-Filter
  sourcePin: store
  destinationFilter: Skill-Result-Store
  destinationPin: input
  strongConnection: 1
- sourceFilter: Skill-VLM
  sourcePin: output
  destinationFilter: Skill-Result-Store
  destinationPin: input2
  strongConnection: 1
