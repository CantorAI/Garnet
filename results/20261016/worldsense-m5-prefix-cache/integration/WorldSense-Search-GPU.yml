id: worldsense_search_gpu
file_type: CantorAI Pipeline
nodes:
- name: Search-Input
  type: tee
  uri: galaxy_forge
  inputPins:
  - name: input
    format: SrchRq
  outputPins:
  - name: output
    format: SrchRq
- name: Skill-Search
  type: Garnet-VLM
  uri: galaxy_garnetfilter
  parameters:
    searchModelMode: separate_text
    textOnlyImagePath: workspace:WorldSense/Backend/Pipelines/worldsense-search-neutral.jpg
    modelRoot: workspace:out/models/Qwen3.5-4B
    xmodelRoot: workspace:Garnet/xModel/qwen35/vl_4b
    cacheRoot: workspace:out/cache/Qwen3.5-4B
    profile: '{"maxInputTokens": 1536, "maxOutputTokens": 512, "imagePixels": 65536,
      "prefillChunk": 64, "linearChunk": true}'
    modelId: Qwen3.5-4B
    textModel:
      modelRoot: workspace:out/models/Qwen3-1.7B
      xmodelRoot: workspace:Garnet/xModel/qwen/metal_dense
      cacheRoot: workspace:out/cache/Qwen3-1.7B
      modelId: Qwen3-1.7B
      profile: '{"maxInputTokens": 1536, "maxOutputTokens": 512, "minPixels": 65536,
        "maxPixels": 65536, "prefillChunk": 16, "textPrefixCache": true}'
    maxOutputTokens: 512
  inputPins:
  - name: input
    format: SrchRq
  outputPins:
  - name: output
    format: SrchRs
- name: Search-Result
  type: tee
  uri: galaxy_forge
  inputPins:
  - name: input
    format: SrchRs
  - name: driver-local
    format: SrchRs
connections:
- sourceFilter: Search-Input
  sourcePin: output
  destinationFilter: Skill-Search
  destinationPin: input
  strongConnection: 1
- sourceFilter: Skill-Search
  sourcePin: output
  destinationFilter: Search-Result
  destinationPin: input
  strongConnection: 1
