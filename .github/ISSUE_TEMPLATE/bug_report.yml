name: Bug report
description: Report a reproducible problem in Garnet
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the repository Security tab instead.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest commands, xModel, inputs, or code needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Garnet commit
      placeholder: Git commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, GPU or CPU, CUDA, TensorRT or OpenVINO, compiler, precision, shapes, and relevant model profile.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach concise logs without credentials, private model data, or proprietary inputs.
      render: shell
